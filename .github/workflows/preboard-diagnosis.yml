name: PreBoard backlight diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/preboard-diagnosis]
    paths: ['.github/workflows/preboard-diagnosis.yml', 'scripts/reverse-backlight.py']
permissions:
  contents: read
jobs:
  reverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IPSW_URL: "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97955/A3F72236-89AD-47C5-8394-5E824079C175/iPad_10.2_18.7.10_22H374_Restore.ipsw"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfuse3-dev zlib1g-dev
          python3 scripts/build-apfs.py bootstrap
      - name: Download and unpack 22H374 firmware
        run: |
          mkdir -p firmware
          curl --fail --location --retry 3 "$IPSW_URL" --output firmware/22H374.ipsw
          python3 scripts/build-apfs.py firmware firmware/22H374.ipsw
      - name: Extract PreBoard assertion evidence
        run: python3 scripts/reverse-backlight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backlight-reverse-extended
          path: |
            build/backlight-reverse/
            build/apfs/prepared-firmware.json
          if-no-files-found: warn
